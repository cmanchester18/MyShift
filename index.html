<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Shift Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F5F0E6;
    --ink:#26211B;
    --ink-soft:#6B6255;
    --rust:#B8451F;
    --rust-dark:#8F3517;
    --herb:#54633C;
    --herb-soft:#EAF0DF;
    --deny:#9A3324;
    --deny-soft:#F5E4DF;
    --line:#DCD2BF;
    --card:#FFFDF8;
    --pending-soft:#F3E9CE;
    --pending-ink:#8A6A1E;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    font-variant-numeric:tabular-nums;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}
  button{font-family:inherit;}
  input,select,textarea{font-family:inherit;font-size:16px;}
  #app{max-width:960px;margin:0 auto;padding:0 0 60px;min-height:100vh;}

  /* ---- top bar ---- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:18px 20px 14px;border-bottom:2px solid var(--ink);
    background:var(--paper);
  }
  .topbar .brand{display:flex;align-items:center;gap:10px;}
  .topbar .brand .mark{
    width:34px;height:34px;border-radius:50%;background:var(--rust);
    display:flex;align-items:center;justify-content:center;color:#fff;
    font-family:'Fraunces',serif;font-weight:700;font-size:16px;flex-shrink:0;
  }
  .topbar h1{font-size:20px;margin:0;font-weight:600;line-height:1.1;}
  .topbar .who{font-size:12px;color:var(--ink-soft);margin-top:2px;}
  .logout-btn{
    background:none;border:1px solid var(--line);color:var(--ink-soft);
    padding:8px 14px;border-radius:20px;font-size:13px;cursor:pointer;
  }
  .logout-btn:active{background:var(--line);}

  /* ---- nav tabs ---- */
  .tabs{display:flex;gap:2px;padding:14px 16px 0;overflow-x:auto;}
  .tab{
    padding:9px 15px;font-size:14px;font-weight:600;color:var(--ink-soft);
    background:none;border:none;border-bottom:3px solid transparent;
    cursor:pointer;white-space:nowrap;
  }
  .tab.active{color:var(--rust);border-bottom-color:var(--rust);}
  .content{padding:18px 16px 10px;}

  /* ---- centered auth screens ---- */
  .auth-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
  .ticket{
    background:var(--card);border:1px solid var(--line);
    border-radius:4px;padding:34px 28px 28px;max-width:380px;width:100%;
    position:relative;box-shadow:0 1px 0 var(--line);
  }
  .ticket::before,.ticket::after{
    content:"";position:absolute;width:18px;height:18px;background:var(--paper);
    border-radius:50%;top:50%;transform:translateY(-50%);
  }
  .ticket::before{left:-9px;}
  .ticket::after{right:-9px;}
  .ticket h2{font-size:26px;margin:0 0 4px;font-weight:600;}
  .ticket p.sub{color:var(--ink-soft);font-size:14px;margin:0 0 22px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:12px;font-weight:600;color:var(--ink-soft);margin-bottom:6px;}
  .field select,.field input,.field textarea{
    width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:3px;
    background:#fff;color:var(--ink);
  }
  .field textarea{resize:vertical;min-height:70px;}
  .btn{
    background:var(--rust);color:#fff;border:none;padding:12px 18px;
    border-radius:3px;font-weight:600;font-size:14px;cursor:pointer;width:100%;
  }
  .btn:active{background:var(--rust-dark);}
  .btn.secondary{background:none;color:var(--ink);border:1px solid var(--ink);}
  .btn.ghost{background:none;color:var(--rust);border:1px solid var(--rust);}
  .btn.small{width:auto;padding:8px 14px;font-size:13px;}
  .btn.block-space{margin-top:8px;}
  .error-msg{color:var(--deny);font-size:13px;margin:-8px 0 14px;}
  .hint{font-size:12px;color:var(--ink-soft);margin-top:14px;text-align:center;}

  /* ---- section header ---- */
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;flex-wrap:wrap;gap:10px;}
  .sec-head h2{font-size:22px;margin:0;font-weight:600;}
  .week-nav{display:flex;align-items:center;gap:10px;}
  .week-nav button{
    background:var(--card);border:1px solid var(--line);width:34px;height:34px;
    border-radius:50%;cursor:pointer;font-size:16px;color:var(--ink);
  }
  .week-nav .wk-label{font-size:14px;font-weight:600;min-width:150px;text-align:center;}

  /* ---- schedule grid ---- */
  .grid-scroll{overflow-x:auto;border:1px solid var(--line);border-radius:4px;background:var(--card);}
  .grid{display:grid;grid-template-columns:130px repeat(7,minmax(108px,1fr));min-width:900px;}
  .grid .corner{background:var(--ink);color:var(--paper);padding:10px;font-size:11px;font-weight:600;position:sticky;left:0;z-index:2;}
  .grid .daycol{
    padding:10px 8px;text-align:center;border-left:1px solid var(--line);background:#F9F5EC;
  }
  .grid .daycol .dname{font-size:11px;font-weight:700;letter-spacing:.03em;color:var(--ink-soft);}
  .grid .daycol .dnum{font-family:'Fraunces',serif;font-size:19px;font-weight:600;}
  .grid .rowname{
    padding:10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:8px;
    border-top:1px solid var(--line);position:sticky;left:0;background:var(--card);z-index:1;
  }
  .avatar{width:24px;height:24px;border-radius:50%;color:#fff;font-size:11px;font-weight:700;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .cell{
    border-top:1px solid var(--line);border-left:1px solid var(--line);
    min-height:56px;padding:5px;display:flex;flex-direction:column;gap:4px;cursor:pointer;
  }
  .cell:active{background:#F1EADA;}
  .chip{
    border-radius:3px;padding:5px 6px;font-size:11px;color:#fff;line-height:1.25;
    border-top:2px dashed rgba(255,255,255,.5);
  }
  .chip .t{font-weight:700;display:block;}
  .add-hint{color:var(--line);font-size:18px;text-align:center;line-height:46px;}
  .grid.readonly .cell{cursor:default;}
  .grid.readonly .cell:active{background:none;}

  /* ---- my week list (employee) ---- */
  .day-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 4px;border-bottom:1px solid var(--line);
  }
  .day-row:last-child{border-bottom:none;}
  .day-row .dlabel{font-size:14px;}
  .day-row .dlabel .dow{font-weight:700;}
  .day-row .dlabel .ddate{color:var(--ink-soft);font-size:12px;}
  .day-row .shift-info{text-align:right;}
  .day-row .shift-info .t{font-weight:700;font-size:14px;}
  .day-row .shift-info .off{color:var(--ink-soft);font-size:13px;}

  /* ---- cards / lists ---- */
  .card{background:var(--card);border:1px solid var(--line);border-radius:4px;padding:16px;margin-bottom:12px;}
  .card .top-row{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:6px;}
  .card .name{font-weight:700;font-size:14px;}
  .card .meta{font-size:13px;color:var(--ink-soft);margin:2px 0;}
  .badge{font-size:11px;font-weight:700;padding:4px 9px;border-radius:20px;white-space:nowrap;}
  .badge.pending{background:var(--pending-soft);color:var(--pending-ink);}
  .badge.approved{background:var(--herb-soft);color:var(--herb);}
  .badge.denied{background:var(--deny-soft);color:var(--deny);}
  .row-actions{display:flex;gap:8px;margin-top:10px;}
  .row-actions .btn{width:auto;flex:1;padding:9px;}
  .empty-note{color:var(--ink-soft);font-size:14px;padding:20px 4px;text-align:center;}
  .subhead{font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--ink-soft);margin:22px 0 10px;}
  .subhead:first-child{margin-top:0;}

  /* team list */
  .team-row{display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);}
  .team-row:last-child{border-bottom:none;}
  .team-left{display:flex;align-items:center;gap:10px;}
  .team-left .tname{font-weight:600;font-size:14px;}
  .team-left .trole{font-size:12px;color:var(--ink-soft);}
  .pin-tag{font-size:12px;color:var(--ink-soft);background:#F1EADA;padding:3px 8px;border-radius:20px;margin-right:8px;}
  .icon-btn{background:none;border:none;color:var(--deny);font-size:13px;cursor:pointer;padding:6px;}

  /* availability grid */
  .avail-day{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap;}
  .avail-day:last-child{border-bottom:none;}
  .avail-day .adname{font-weight:600;font-size:14px;width:80px;}
  .toggle-pair{display:flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;flex-shrink:0;}
  .toggle-pair button{border:none;background:#fff;padding:6px 12px;font-size:12px;font-weight:600;cursor:pointer;color:var(--ink-soft);}
  .toggle-pair button.on.avail{background:var(--herb);color:#fff;}
  .toggle-pair button.on.unavail{background:var(--deny);color:#fff;}
  .avail-times{display:flex;gap:6px;align-items:center;}
  .avail-times input{padding:6px 8px;width:100px;}

  /* modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(38,33,27,.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  @media(min-width:640px){.modal-backdrop{align-items:center;}}
  .modal{background:var(--card);border-radius:10px 10px 0 0;padding:22px 20px 26px;width:100%;max-width:440px;max-height:88vh;overflow-y:auto;}
  @media(min-width:640px){.modal{border-radius:8px;}}
  .modal h3{margin:0 0 16px;font-size:19px;font-weight:600;}
  .modal-actions{display:flex;gap:10px;margin-top:18px;}
  .modal-actions .btn{width:auto;flex:1;}
  .close-x{position:sticky;top:0;float:right;background:none;border:none;font-size:20px;color:var(--ink-soft);cursor:pointer;}

  .fab{
    position:fixed;bottom:22px;right:22px;background:var(--rust);color:#fff;border:none;
    width:54px;height:54px;border-radius:50%;font-size:26px;box-shadow:0 3px 10px rgba(0,0,0,.25);
    cursor:pointer;z-index:30;
  }
  .loading{display:flex;align-items:center;justify-content:center;min-height:100vh;color:var(--ink-soft);}
</style>
</head>
<body>
<div id="app"><div class="loading">Loading Shift Board…</div></div>

<script type="module">
/* ============ Firebase (shared storage across everyone's phones) ============ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

// 👇 Replace this with the config object from your Firebase project (see setup notes)
const firebaseConfig = {
  apiKey: "AIzaSyA7un6qmWdYwsXiaiSkq4kMIJqpLafum24",
  authDomain: "cbc-schedule.firebaseapp.com",
  projectId: "cbc-schedule",
  storageBucket: "cbc-schedule.firebasestorage.app",
  messagingSenderId: "442268723552",
  appId: "1:442268723552:web:33eeb18c396c2f396c5605"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);

/* ============ constants ============ */
const DAY_NAMES=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
const EMP_COLORS=['#B8451F','#54633C','#B6821F','#3E6B6B','#7A4B6B','#3B5A7A','#8A5A2E','#5C5C3D','#A84A66','#3E7A5A'];

/* ============ state ============ */
let state={
  employees:[],
  requests:[],
  timeEntries:[],
  restaurantName:'',
  scheduleCache:{}, // weekKey -> shifts array
  currentUser:null,
  view:'login',
  weekStart:getMonday(new Date()),
  modal:null,
  loading:true,
  error:''
};

/* ============ date helpers ============ */
function getMonday(d){
  const date=new Date(d);
  const day=date.getDay();
  const diff=(day===0?-6:1-day);
  date.setDate(date.getDate()+diff);
  date.setHours(0,0,0,0);
  return date;
}
function addDays(date,n){const d=new Date(date);d.setDate(d.getDate()+n);return d;}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function weekKey(d){return iso(getMonday(d));}
function fmtRange(d1,d2){
  const o={month:'short',day:'numeric'};
  return `${d1.toLocaleDateString('en-US',o)} – ${d2.toLocaleDateString('en-US',o)}`;
}
function fmtTime(hhmm){
  if(!hhmm)return'';
  const[h,m]=hhmm.split(':').map(Number);
  const ampm=h>=12?'PM':'AM';
  const h12=h%12===0?12:h%12;
  return `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
}
function uid(){return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);}
function esc(s){return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function empColor(id){
  const idx=state.employees.findIndex(e=>e.id===id);
  return EMP_COLORS[idx>=0?idx%EMP_COLORS.length:0];
}
function empName(id){const e=state.employees.find(e=>e.id===id);return e?e.name:'Unknown';}
function initials(name){return name.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase();}

/* ============ storage layer (Firestore) ============ */
async function storeGet(key){
  try{
    const snap=await getDoc(doc(db,'shiftboard',key));
    return snap.exists()?snap.data().value:null;
  }catch(e){console.error('load failed',key,e);return null;}
}
async function storeSet(key,val){
  try{await setDoc(doc(db,'shiftboard',key),{value:val});}catch(e){console.error('save failed',key,e);}
}

async function loadEmployees(){state.employees=(await storeGet('employees'))||[];}
async function saveEmployees(){await storeSet('employees',state.employees);}
async function loadRequests(){state.requests=(await storeGet('requests'))||[];}
async function saveRequests(){await storeSet('requests',state.requests);}
async function loadTimeEntries(){state.timeEntries=(await storeGet('timeclock'))||[];}
async function saveTimeEntries(){await storeSet('timeclock',state.timeEntries);}
async function loadRestaurantName(){state.restaurantName=(await storeGet('restaurant-name'))||'';}
async function loadWeek(wk){
  if(state.scheduleCache[wk])return state.scheduleCache[wk];
  const data=(await storeGet('schedule-'+wk))||[];
  state.scheduleCache[wk]=data;
  return data;
}
async function saveWeek(wk,shifts){
  state.scheduleCache[wk]=shifts;
  await storeSet('schedule-'+wk,shifts);
}

/* ============ init ============ */
async function init(){
  await Promise.all([loadEmployees(),loadRequests(),loadRestaurantName(),loadTimeEntries()]);
  await loadWeek(weekKey(state.weekStart));
  state.loading=false;
  state.view = state.employees.length===0 ? 'setup' : 'login';
  render();
}

/* ============ actions: setup / login ============ */
async function doSetup(){
  const rname=document.getElementById('su-restaurant').value.trim();
  const oname=document.getElementById('su-name').value.trim();
  const pin=document.getElementById('su-pin').value.trim();
  if(!rname||!oname||!/^\d{4,6}$/.test(pin)){
    state.error='Fill in every field. PIN should be 4–6 digits.';render();return;
  }
  state.restaurantName=rname;
  await storeSet('restaurant-name',rname);
  const owner={id:uid(),name:oname,pin,role:'admin'};
  state.employees=[owner];
  await saveEmployees();
  state.currentUser=owner;
  state.view='admin-schedule';
  state.error='';
  render();
}
async function doLogin(){
  const empId=document.getElementById('lg-emp').value;
  const pin=document.getElementById('lg-pin').value.trim();
  const emp=state.employees.find(e=>e.id===empId);
  if(!emp||emp.pin!==pin){state.error='Wrong PIN. Try again.';render();return;}
  state.currentUser=emp;
  state.view= emp.role==='admin' ? 'admin-schedule':'employee-clock';
  state.error='';
  render();
}
function doLogout(){
  state.currentUser=null;state.view='login';state.error='';render();
}

/* ============ actions: schedule ============ */
function openShiftModal(employeeId,day){
  const wk=weekKey(state.weekStart);
  const shifts=state.scheduleCache[wk]||[];
  const existing=shifts.find(s=>s.employeeId===employeeId&&s.day===day);
  state.modal={type:'shift',employeeId,day,existing};
  render();
}
async function saveShift(){
  const {employeeId,day,existing}=state.modal;
  const start=document.getElementById('sh-start').value;
  const end=document.getElementById('sh-end').value;
  const note=document.getElementById('sh-note').value.trim();
  if(!start||!end){state.error='Set a start and end time.';render();return;}
  const wk=weekKey(state.weekStart);
  let shifts=[...(state.scheduleCache[wk]||[])];
  if(existing){
    shifts=shifts.map(s=>s.id===existing.id?{...s,start,end,note}:s);
  }else{
    shifts.push({id:uid(),employeeId,day,start,end,note});
  }
  await saveWeek(wk,shifts);
  state.modal=null;state.error='';render();
}
async function deleteShift(){
  const {existing}=state.modal;
  if(!existing){state.modal=null;render();return;}
  const wk=weekKey(state.weekStart);
  const shifts=(state.scheduleCache[wk]||[]).filter(s=>s.id!==existing.id);
  await saveWeek(wk,shifts);
  state.modal=null;render();
}
async function copyPreviousWeek(){
  const prevWk=weekKey(addDays(state.weekStart,-7));
  const curWk=weekKey(state.weekStart);
  const prevShifts=await loadWeek(prevWk);
  if(prevShifts.length===0){state.error='No shifts found last week to copy.';render();return;}
  const copied=prevShifts.map(s=>({...s,id:uid()}));
  await saveWeek(curWk,copied);
  state.error='';render();
}
function changeWeek(delta){
  state.weekStart=addDays(state.weekStart,7*delta);
  loadWeek(weekKey(state.weekStart)).then(render);
}

/* ============ time clock: helpers ============ */
function isoToLocalDateStr(iso){
  const d=new Date(iso);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function isoToLocalTimeStr(iso){
  const d=new Date(iso);
  return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
}
function fmtClockTime(iso){return fmtTime(isoToLocalTimeStr(iso));}
function entryDayIndex(entry,weekStart){
  const d=new Date(entry.clockIn);
  const dOnly=new Date(d.getFullYear(),d.getMonth(),d.getDate());
  const wsOnly=new Date(weekStart.getFullYear(),weekStart.getMonth(),weekStart.getDate());
  return Math.round((dOnly-wsOnly)/86400000);
}
function entriesForWeek(employeeId,weekStart){
  return state.timeEntries.filter(e=>e.employeeId===employeeId).filter(e=>{
    const idx=entryDayIndex(e,weekStart);
    return idx>=0&&idx<7;
  });
}
function hoursFor(entry){
  if(!entry.clockOut)return null;
  return (new Date(entry.clockOut)-new Date(entry.clockIn))/3600000;
}
function weeklyTotalHours(employeeId,weekStart){
  return entriesForWeek(employeeId,weekStart).reduce((sum,e)=>sum+(hoursFor(e)||0),0);
}
function activeEntryFor(employeeId){
  return state.timeEntries.find(e=>e.employeeId===employeeId&&!e.clockOut);
}

/* ============ actions: time clock ============ */
async function clockIn(){
  if(activeEntryFor(state.currentUser.id)){state.error='You are already clocked in.';render();return;}
  state.timeEntries.push({id:uid(),employeeId:state.currentUser.id,clockIn:new Date().toISOString(),clockOut:null});
  await saveTimeEntries();
  state.error='';render();
}
async function clockOut(){
  const idx=state.timeEntries.findIndex(e=>e.employeeId===state.currentUser.id&&!e.clockOut);
  if(idx===-1){state.error='You are not clocked in.';render();return;}
  state.timeEntries[idx]={...state.timeEntries[idx],clockOut:new Date().toISOString()};
  await saveTimeEntries();
  render();
}
function openTimeEntryModal(existing){state.modal={type:'timeentry',existing:existing||null};render();}
function openTimeEntryModalById(id){openTimeEntryModal(state.timeEntries.find(e=>e.id===id)||null);}
async function saveTimeEntry(){
  const employeeId=document.getElementById('te-emp').value;
  const date=document.getElementById('te-date').value;
  const inT=document.getElementById('te-in').value;
  const outT=document.getElementById('te-out').value;
  if(!employeeId||!date||!inT){state.error='Pick an employee, date, and clock-in time.';render();return;}
  const clockIn=new Date(date+'T'+inT).toISOString();
  const clockOut=outT?new Date(date+'T'+outT).toISOString():null;
  const existing=state.modal.existing;
  if(existing){
    state.timeEntries=state.timeEntries.map(e=>e.id===existing.id?{...e,employeeId,clockIn,clockOut}:e);
  }else{
    state.timeEntries.push({id:uid(),employeeId,clockIn,clockOut});
  }
  await saveTimeEntries();
  state.modal=null;state.error='';render();
}
async function deleteTimeEntry(){
  const existing=state.modal.existing;
  if(!existing){state.modal=null;render();return;}
  state.timeEntries=state.timeEntries.filter(e=>e.id!==existing.id);
  await saveTimeEntries();
  state.modal=null;render();
}

/* ============ actions: requests ============ */
function openTimeOffModal(){state.modal={type:'timeoff'};render();}
async function submitTimeOff(){
  const startDate=document.getElementById('to-start').value;
  const endDate=document.getElementById('to-end').value;
  const reason=document.getElementById('to-reason').value.trim();
  if(!startDate||!endDate){state.error='Pick a start and end date.';render();return;}
  state.requests.push({
    id:uid(),employeeId:state.currentUser.id,type:'timeoff',status:'pending',
    createdAt:Date.now(),startDate,endDate,reason
  });
  await saveRequests();
  state.modal=null;state.error='';render();
}
async function setRequestStatus(id,status){
  state.requests=state.requests.map(r=>r.id===id?{...r,status}:r);
  await saveRequests();
  render();
}
function openAvailabilityModal(){
  const existing=[...state.requests].reverse().find(r=>r.type==='availability'&&r.employeeId===state.currentUser.id);
  const days={};
  DAY_NAMES.forEach((d,i)=>{
    const prev=existing&&existing.days?existing.days[i]:null;
    days[i]=prev?{...prev}:{available:true,start:'09:00',end:'17:00'};
  });
  state.modal={type:'availability',days,note:existing?existing.note:''};
  render();
}
function toggleAvailDay(i,val){
  state.modal.days[i].available=val;render();
}
async function submitAvailability(){
  const note=document.getElementById('av-note').value.trim();
  DAY_NAMES.forEach((d,i)=>{
    const s=document.getElementById('av-start-'+i);
    const e=document.getElementById('av-end-'+i);
    if(s)state.modal.days[i].start=s.value;
    if(e)state.modal.days[i].end=e.value;
  });
  state.requests.push({
    id:uid(),employeeId:state.currentUser.id,type:'availability',status:'pending',
    createdAt:Date.now(),days:state.modal.days,note
  });
  await saveRequests();
  state.modal=null;render();
}

/* ============ actions: team ============ */
function openAddEmployeeModal(){state.modal={type:'employee'};render();}
async function saveEmployee(){
  const name=document.getElementById('em-name').value.trim();
  const pin=document.getElementById('em-pin').value.trim();
  const role=document.getElementById('em-role').value;
  if(!name||!/^\d{4,6}$/.test(pin)){state.error='Enter a name and a 4–6 digit PIN.';render();return;}
  state.employees.push({id:uid(),name,pin,role});
  await saveEmployees();
  state.modal=null;state.error='';render();
}
async function removeEmployee(id){
  if(id===state.currentUser.id){state.error="You can't remove yourself.";render();return;}
  state.employees=state.employees.filter(e=>e.id!==id);
  await saveEmployees();
  render();
}
function closeModal(){state.modal=null;state.error='';render();}

/* ============ render ============ */
function render(){
  const app=document.getElementById('app');
  if(state.loading){app.innerHTML='<div class="loading">Loading Shift Board…</div>';return;}
  let html='';
  if(state.view==='setup')html=renderSetup();
  else if(state.view==='login')html=renderLogin();
  else html=renderAppShell();
  if(state.modal)html+=renderModal();
  app.innerHTML=html;
  attachDynamicListeners();
}

function renderSetup(){
  return `
  <div class="auth-wrap"><div class="ticket">
    <h2>Set up Shift Board</h2>
    <p class="sub">Create your restaurant and your owner/manager login.</p>
    ${state.error?`<div class="error-msg">${esc(state.error)}</div>`:''}
    <div class="field"><label>Restaurant name</label><input id="su-restaurant" placeholder="e.g. Mario's Kitchen"></div>
    <div class="field"><label>Your name</label><input id="su-name" placeholder="e.g. Mario"></div>
    <div class="field"><label>Choose a PIN (4–6 digits)</label><input id="su-pin" inputmode="numeric" maxlength="6" placeholder="1234"></div>
    <button class="btn" onclick="doSetup()">Create Shift Board</button>
    <p class="hint">You can add employees once you're in.</p>
  </div></div>`;
}

function renderLogin(){
  const options=state.employees.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('');
  return `
  <div class="auth-wrap"><div class="ticket">
    <h2>${esc(state.restaurantName||'Shift Board')}</h2>
    <p class="sub">Pick your name and enter your PIN.</p>
    ${state.error?`<div class="error-msg">${esc(state.error)}</div>`:''}
    <div class="field"><label>Name</label><select id="lg-emp">${options}</select></div>
    <div class="field"><label>PIN</label><input id="lg-pin" type="password" inputmode="numeric" maxlength="6" placeholder="••••"></div>
    <button class="btn" onclick="doLogin()">Log in</button>
  </div></div>`;
}

function renderAppShell(){
  const isAdmin=state.currentUser.role==='admin';
  const tabs=isAdmin
    ? [['admin-schedule','Schedule'],['admin-hours','Hours'],['admin-requests','Requests'],['admin-team','Team']]
    : [['employee-clock','Clock'],['employee-schedule','My Week'],['employee-full','Full Schedule'],['employee-timeoff','Time Off'],['employee-availability','Availability']];
  const tabsHtml=tabs.map(([v,label])=>
    `<button class="tab ${state.view===v?'active':''}" onclick="switchView('${v}')">${label}</button>`
  ).join('');

  let body='';
  if(state.view==='admin-schedule')body=renderAdminSchedule();
  else if(state.view==='admin-hours')body=renderAdminHours();
  else if(state.view==='admin-requests')body=renderAdminRequests();
  else if(state.view==='admin-team')body=renderAdminTeam();
  else if(state.view==='employee-clock')body=renderEmployeeClock();
  else if(state.view==='employee-schedule')body=renderEmployeeSchedule();
  else if(state.view==='employee-full')body=renderFullScheduleReadonly();
  else if(state.view==='employee-timeoff')body=renderTimeOff();
  else if(state.view==='employee-availability')body=renderAvailability();

  return `
  <div class="topbar">
    <div class="brand">
      <div class="mark">${initials(state.restaurantName||'SB')}</div>
      <div><h1>${esc(state.restaurantName||'Shift Board')}</h1>
      <div class="who">${esc(state.currentUser.name)} · ${isAdmin?'Manager':'Staff'}</div></div>
    </div>
    <button class="logout-btn" onclick="doLogout()">Log out</button>
  </div>
  <div class="tabs">${tabsHtml}</div>
  <div class="content">${state.error?`<div class="error-msg">${esc(state.error)}</div>`:''}${body}</div>
  `;
}
function switchView(v){state.view=v;state.error='';render();}

/* ---- admin: schedule grid ---- */
function renderWeekNav(){
  const start=state.weekStart, end=addDays(start,6);
  return `<div class="week-nav">
    <button onclick="changeWeek(-1)">‹</button>
    <div class="wk-label">${fmtRange(start,end)}</div>
    <button onclick="changeWeek(1)">›</button>
  </div>`;
}
function renderAdminSchedule(){
  const wk=weekKey(state.weekStart);
  const shifts=state.scheduleCache[wk]||[];
  const days=[...Array(7)].map((_,i)=>addDays(state.weekStart,i));
  let grid=`<div class="corner">Team</div>`;
  days.forEach((d,i)=>{
    grid+=`<div class="daycol"><div class="dname">${DAY_NAMES[i]}</div><div class="dnum">${d.getDate()}</div></div>`;
  });
  state.employees.forEach(emp=>{
    grid+=`<div class="rowname"><div class="avatar" style="background:${empColor(emp.id)}">${initials(emp.name)}</div>${esc(emp.name)}</div>`;
    for(let i=0;i<7;i++){
      const s=shifts.find(sh=>sh.employeeId===emp.id&&sh.day===i);
      grid+=`<div class="cell" onclick="openShiftModal('${emp.id}',${i})">`;
      grid+= s
        ? `<div class="chip" style="background:${empColor(emp.id)}"><span class="t">${fmtTime(s.start)}–${fmtTime(s.end)}</span>${s.note?esc(s.note):''}</div>`
        : `<div class="add-hint">+</div>`;
      grid+=`</div>`;
    }
  });
  return `
  <div class="sec-head"><h2>Schedule</h2>${renderWeekNav()}</div>
  ${state.employees.length===0?'<div class="empty-note">Add employees in the Team tab first.</div>':`
  <div class="grid-scroll"><div class="grid">${grid}</div></div>
  <div style="margin-top:14px;"><button class="btn ghost small" onclick="copyPreviousWeek()">Copy last week's schedule</button></div>
  `}`;
}

/* ---- employee: read-only full schedule (reuses grid, no click) ---- */
function renderFullScheduleReadonly(){
  const wk=weekKey(state.weekStart);
  const shifts=state.scheduleCache[wk]||[];
  const days=[...Array(7)].map((_,i)=>addDays(state.weekStart,i));
  let grid=`<div class="corner">Team</div>`;
  days.forEach((d,i)=>{
    grid+=`<div class="daycol"><div class="dname">${DAY_NAMES[i]}</div><div class="dnum">${d.getDate()}</div></div>`;
  });
  state.employees.forEach(emp=>{
    grid+=`<div class="rowname"><div class="avatar" style="background:${empColor(emp.id)}">${initials(emp.name)}</div>${esc(emp.name)}</div>`;
    for(let i=0;i<7;i++){
      const s=shifts.find(sh=>sh.employeeId===emp.id&&sh.day===i);
      grid+=`<div class="cell">`;
      grid+= s ? `<div class="chip" style="background:${empColor(emp.id)}"><span class="t">${fmtTime(s.start)}–${fmtTime(s.end)}</span></div>` : '';
      grid+=`</div>`;
    }
  });
  return `
  <div class="sec-head"><h2>Full Schedule</h2>${renderWeekNav()}</div>
  <div class="grid-scroll"><div class="grid readonly">${grid}</div></div>`;
}

/* ---- employee: clock in/out ---- */
function renderEmployeeClock(){
  const active=activeEntryFor(state.currentUser.id);
  const wk=state.weekStart;
  const entries=entriesForWeek(state.currentUser.id,wk).sort((a,b)=>new Date(a.clockIn)-new Date(b.clockIn));
  const total=weeklyTotalHours(state.currentUser.id,wk);
  const statusCard=active?`
    <div class="card" style="text-align:center;padding:28px 16px;">
      <div class="meta">Clocked in since</div>
      <div class="serif" style="font-size:28px;font-weight:600;margin:4px 0 20px;">${fmtClockTime(active.clockIn)}</div>
      <button class="btn" style="width:auto;padding:13px 34px;background:var(--deny)" onclick="clockOut()">Clock Out</button>
    </div>`:`
    <div class="card" style="text-align:center;padding:28px 16px;">
      <div class="meta">You're clocked out</div>
      <button class="btn" style="width:auto;padding:13px 34px;margin-top:16px" onclick="clockIn()">Clock In</button>
    </div>`;
  const entryRows=entries.length===0?'<div class="empty-note">No shifts clocked this week.</div>':entries.map(e=>{
    const h=hoursFor(e);
    return `<div class="day-row">
      <div class="dlabel"><div class="dow">${new Date(e.clockIn).toLocaleDateString('en-US',{weekday:'short'})}</div><div class="ddate">${new Date(e.clockIn).toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div></div>
      <div class="shift-info"><div class="t">${fmtClockTime(e.clockIn)} – ${e.clockOut?fmtClockTime(e.clockOut):'now'}</div>${h!==null?`<div class="off">${h.toFixed(1)} hrs</div>`:'<div class="off">in progress</div>'}</div>
    </div>`;
  }).join('');
  return `
  <div class="sec-head"><h2>Clock</h2>${renderWeekNav()}</div>
  ${statusCard}
  <div class="subhead">This week · ${total.toFixed(1)} hrs total</div>
  <div class="card">${entryRows}</div>`;
}

/* ---- admin: hours ---- */
function renderAdminHours(){
  const wk=state.weekStart;
  const rows=state.employees.map(emp=>{
    const entries=entriesForWeek(emp.id,wk).sort((a,b)=>new Date(a.clockIn)-new Date(b.clockIn));
    const total=weeklyTotalHours(emp.id,wk);
    const active=activeEntryFor(emp.id);
    const entryRows=entries.length===0?'<div class="empty-note">No entries this week.</div>':entries.map(e=>{
      const h=hoursFor(e);
      return `<div class="team-row" style="cursor:pointer" onclick="openTimeEntryModalById('${e.id}')">
        <div class="team-left"><div style="font-size:13px;font-weight:600">${new Date(e.clockIn).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}</div></div>
        <div style="font-size:13px;color:var(--ink-soft)">${fmtClockTime(e.clockIn)} – ${e.clockOut?fmtClockTime(e.clockOut):'still on clock'}${h!==null?` · ${h.toFixed(1)} hrs`:''}</div>
      </div>`;
    }).join('');
    return `<div class="card">
      <div class="top-row">
        <div><div class="name">${esc(emp.name)}</div>${active?'<div class="badge approved">On the clock</div>':''}</div>
        <div style="text-align:right"><div class="name">${total.toFixed(1)} hrs</div><div class="meta">this week</div></div>
      </div>
      ${entryRows}
    </div>`;
  }).join('');
  return `
  <div class="sec-head"><h2>Hours</h2>${renderWeekNav()}</div>
  <div style="margin-bottom:12px"><button class="btn ghost small" onclick="openTimeEntryModal(null)">+ Add manual entry</button></div>
  ${state.employees.length===0?'<div class="empty-note">Add employees in the Team tab first.</div>':rows}`;
}

/* ---- employee: my week list ---- */
function renderEmployeeSchedule(){
  const wk=weekKey(state.weekStart);
  const shifts=(state.scheduleCache[wk]||[]).filter(s=>s.employeeId===state.currentUser.id);
  const days=[...Array(7)].map((_,i)=>addDays(state.weekStart,i));
  const rows=days.map((d,i)=>{
    const s=shifts.find(sh=>sh.day===i);
    return `<div class="day-row">
      <div class="dlabel"><div class="dow">${DAY_NAMES[i]}</div><div class="ddate">${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</div></div>
      <div class="shift-info">${s?`<div class="t">${fmtTime(s.start)} – ${fmtTime(s.end)}</div>${s.note?`<div class="off">${esc(s.note)}</div>`:''}`:'<div class="off">Not scheduled</div>'}</div>
    </div>`;
  }).join('');
  return `
  <div class="sec-head"><h2>My Week</h2>${renderWeekNav()}</div>
  <div class="card">${rows}</div>`;
}

/* ---- employee: time off ---- */
function renderTimeOff(){
  const mine=state.requests.filter(r=>r.type==='timeoff'&&r.employeeId===state.currentUser.id).sort((a,b)=>b.createdAt-a.createdAt);
  const list=mine.length===0?'<div class="empty-note">No time-off requests yet.</div>':mine.map(r=>`
    <div class="card">
      <div class="top-row"><div class="name">${r.startDate}${r.startDate!==r.endDate?' → '+r.endDate:''}</div><div class="badge ${r.status}">${r.status}</div></div>
      ${r.reason?`<div class="meta">${esc(r.reason)}</div>`:''}
    </div>`).join('');
  return `
  <div class="sec-head"><h2>Time Off</h2><button class="btn small" style="width:auto" onclick="openTimeOffModal()">+ New request</button></div>
  ${list}`;
}

/* ---- employee: availability ---- */
function renderAvailability(){
  const mine=state.requests.filter(r=>r.type==='availability'&&r.employeeId===state.currentUser.id).sort((a,b)=>b.createdAt-a.createdAt);
  const list=mine.length===0?'<div class="empty-note">You haven&#39;t submitted your availability yet.</div>':mine.map(r=>{
    const dayline=DAY_NAMES.map((d,i)=>r.days[i].available?`${d} ${fmtTime(r.days[i].start)}–${fmtTime(r.days[i].end)}`:`${d} off`).join(' · ');
    return `<div class="card">
      <div class="top-row"><div class="name">Submitted ${new Date(r.createdAt).toLocaleDateString()}</div><div class="badge ${r.status}">${r.status}</div></div>
      <div class="meta">${dayline}</div>
      ${r.note?`<div class="meta">"${esc(r.note)}"</div>`:''}
    </div>`;
  }).join('');
  return `
  <div class="sec-head"><h2>Availability</h2><button class="btn small" style="width:auto" onclick="openAvailabilityModal()">Update availability</button></div>
  ${list}`;
}

/* ---- admin: requests ---- */
function renderAdminRequests(){
  const pending=state.requests.filter(r=>r.status==='pending').sort((a,b)=>a.createdAt-b.createdAt);
  const history=state.requests.filter(r=>r.status!=='pending').sort((a,b)=>b.createdAt-a.createdAt).slice(0,20);
  function reqCard(r,showActions){
    if(r.type==='timeoff'){
      return `<div class="card">
        <div class="top-row"><div class="name">${esc(empName(r.employeeId))} — Time off</div>${!showActions?`<div class="badge ${r.status}">${r.status}</div>`:''}</div>
        <div class="meta">${r.startDate}${r.startDate!==r.endDate?' → '+r.endDate:''}</div>
        ${r.reason?`<div class="meta">"${esc(r.reason)}"</div>`:''}
        ${showActions?`<div class="row-actions"><button class="btn secondary" onclick="setRequestStatus('${r.id}','denied')">Deny</button><button class="btn" onclick="setRequestStatus('${r.id}','approved')">Approve</button></div>`:''}
      </div>`;
    }else{
      const dayline=DAY_NAMES.map((d,i)=>r.days[i].available?`${d} ${fmtTime(r.days[i].start)}–${fmtTime(r.days[i].end)}`:`${d} off`).join(' · ');
      return `<div class="card">
        <div class="top-row"><div class="name">${esc(empName(r.employeeId))} — Availability</div>${!showActions?`<div class="badge ${r.status}">${r.status}</div>`:''}</div>
        <div class="meta">${dayline}</div>
        ${r.note?`<div class="meta">"${esc(r.note)}"</div>`:''}
        ${showActions?`<div class="row-actions"><button class="btn secondary" onclick="setRequestStatus('${r.id}','denied')">Dismiss</button><button class="btn" onclick="setRequestStatus('${r.id}','approved')">Acknowledge</button></div>`:''}
      </div>`;
    }
  }
  return `
  <div class="sec-head"><h2>Requests</h2></div>
  <div class="subhead">Pending (${pending.length})</div>
  ${pending.length===0?'<div class="empty-note">Nothing waiting on you.</div>':pending.map(r=>reqCard(r,true)).join('')}
  <div class="subhead">History</div>
  ${history.length===0?'<div class="empty-note">Nothing yet.</div>':history.map(r=>reqCard(r,false)).join('')}
  `;
}

/* ---- admin: team ---- */
function renderAdminTeam(){
  const rows=state.employees.map(e=>`
    <div class="team-row">
      <div class="team-left"><div class="avatar" style="background:${empColor(e.id)}">${initials(e.name)}</div>
        <div><div class="tname">${esc(e.name)}</div><div class="trole">${e.role==='admin'?'Manager':'Staff'}</div></div>
      </div>
      <div><span class="pin-tag">PIN ${e.pin}</span><button class="icon-btn" onclick="removeEmployee('${e.id}')">Remove</button></div>
    </div>`).join('');
  return `
  <div class="sec-head"><h2>Team</h2><button class="btn small" style="width:auto" onclick="openAddEmployeeModal()">+ Add employee</button></div>
  <div class="card">${rows}</div>`;
}

/* ---- modals ---- */
function renderModal(){
  const m=state.modal;
  let body='';
  if(m.type==='shift'){
    const s=m.existing;
    body=`
    <h3>${empName(m.employeeId)} — ${DAY_NAMES[m.day]}</h3>
    <div class="field"><label>Start</label><input id="sh-start" type="time" value="${s?s.start:'09:00'}"></div>
    <div class="field"><label>End</label><input id="sh-end" type="time" value="${s?s.end:'17:00'}"></div>
    <div class="field"><label>Note (optional)</label><input id="sh-note" placeholder="e.g. Closing shift" value="${s?esc(s.note||''):''}"></div>
    <div class="modal-actions">
      ${s?`<button class="btn secondary" onclick="deleteShift()">Delete</button>`:`<button class="btn secondary" onclick="closeModal()">Cancel</button>`}
      <button class="btn" onclick="saveShift()">Save</button>
    </div>`;
  }else if(m.type==='timeoff'){
    body=`
    <h3>Request time off</h3>
    <div class="field"><label>From</label><input id="to-start" type="date"></div>
    <div class="field"><label>To</label><input id="to-end" type="date"></div>
    <div class="field"><label>Reason (optional)</label><textarea id="to-reason" placeholder="Let your manager know why"></textarea></div>
    <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="submitTimeOff()">Send request</button></div>`;
  }else if(m.type==='availability'){
    const rows=DAY_NAMES.map((d,i)=>{
      const day=m.days[i];
      return `<div class="avail-day">
        <div class="adname">${d}</div>
        <div class="toggle-pair">
          <button class="${day.available?'on avail':''}" onclick="toggleAvailDay(${i},true)">Available</button>
          <button class="${!day.available?'on unavail':''}" onclick="toggleAvailDay(${i},false)">Off</button>
        </div>
        ${day.available?`<div class="avail-times">
          <input id="av-start-${i}" type="time" value="${day.start}">
          <span>–</span>
          <input id="av-end-${i}" type="time" value="${day.end}">
        </div>`:''}
      </div>`;
    }).join('');
    body=`
    <h3>Set your availability</h3>
    ${rows}
    <div class="field" style="margin-top:14px;"><label>Anything else? (e.g. want more hours)</label><textarea id="av-note" placeholder="Optional note for your manager">${esc(m.note||'')}</textarea></div>
    <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="submitAvailability()">Submit</button></div>`;
  }else if(m.type==='timeentry'){
    const e=m.existing;
    const empOptions=state.employees.map(emp=>`<option value="${emp.id}" ${e&&e.employeeId===emp.id?'selected':''}>${esc(emp.name)}</option>`).join('');
    body=`
    <h3>${e?'Edit':'Add'} time entry</h3>
    <div class="field"><label>Employee</label><select id="te-emp">${empOptions}</select></div>
    <div class="field"><label>Date</label><input id="te-date" type="date" value="${e?isoToLocalDateStr(e.clockIn):iso(new Date())}"></div>
    <div class="field"><label>Clock in</label><input id="te-in" type="time" value="${e?isoToLocalTimeStr(e.clockIn):'09:00'}"></div>
    <div class="field"><label>Clock out (leave blank if still on the clock)</label><input id="te-out" type="time" value="${e&&e.clockOut?isoToLocalTimeStr(e.clockOut):''}"></div>
    <div class="modal-actions">
      ${e?`<button class="btn secondary" onclick="deleteTimeEntry()">Delete</button>`:`<button class="btn secondary" onclick="closeModal()">Cancel</button>`}
      <button class="btn" onclick="saveTimeEntry()">Save</button>
    </div>`;
  }else if(m.type==='employee'){
    body=`
    <h3>Add employee</h3>
    <div class="field"><label>Name</label><input id="em-name" placeholder="Full name"></div>
    <div class="field"><label>PIN (4–6 digits)</label><input id="em-pin" inputmode="numeric" maxlength="6" placeholder="1234"></div>
    <div class="field"><label>Role</label><select id="em-role"><option value="employee">Staff</option><option value="admin">Manager</option></select></div>
    <div class="modal-actions"><button class="btn secondary" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveEmployee()">Add</button></div>`;
  }
  return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${body}</div></div>`;
}

function attachDynamicListeners(){ /* all handlers are inline via onclick for simplicity */ }

/* expose functions referenced by inline onclick="" attributes in the rendered HTML */
Object.assign(window,{
  doSetup,doLogin,doLogout,switchView,changeWeek,copyPreviousWeek,
  openShiftModal,saveShift,deleteShift,
  openTimeOffModal,submitTimeOff,setRequestStatus,
  openAvailabilityModal,toggleAvailDay,submitAvailability,
  openAddEmployeeModal,saveEmployee,removeEmployee,closeModal,
  clockIn,clockOut,openTimeEntryModal,openTimeEntryModalById,saveTimeEntry,deleteTimeEntry
});

init();
</script>
</body>
</html>
